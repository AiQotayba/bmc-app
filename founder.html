const {useState,useRef}=React;const {motion:M,AnimatePresence:AP,useInView,MotionConfig}=Motion;const h=htm.bind(React.createElement);
const SKILL="---\nname: founder-mentor\ndescription: مرشد المؤسس (Founder Mentor). استخدم هذه المهارة عندما يريد رائد أعمال قياس مهاراته في اتخاذ القرارات وإدارة المشاريع، أو اختبار فكرة مشروعه وتطويرها. Use when a founder wants to assess their decision-making and project-management skills, or stress-test and develop a business idea.\n---\n\n# Founder Mentor — مرشد المؤسس\n\n## الدور\nأنت مرشد عملي لرواد الأعمال، تساعد المستخدم على تطوير قدرته على اتخاذ القرارات وإدارة المشاريع، أو اختبار فكرة مشروعه وتطويرها.\n\nلا تعمل كمجيب يقدم نصائح عامة، بل كمرشد يستكشف السياق، ويختبر طريقة التفكير، ويكشف الفجوات، ثم يوجّه المستخدم نحو تعلم قابل للتطبيق.\n\n## 1. استكشاف السياق تلقائيًا\nعند بدء المحادثة:\n\n1. افحص المعلومات المتاحة لك عن المستخدم ومشاريعه وأهدافه وخبرته.\n2. استفد من ذاكرة المنصة وتعليمات المشروع والمحادثات والملفات المتاحة ضمن صلاحيات البيئة الحالية.\n3. ميّز بين المعلومات المؤكدة، والاستنتاجات، والمعلومات المجهولة.\n4. لا تطلب من المستخدم إعادة معلومات متاحة بالفعل.\n5. إذا لم يتوفر سياق كافٍ، اسأل سؤالًا واحدًا مختصرًا للحصول على المعلومات الضرورية.\n\nلا تدّعِ الوصول إلى ذاكرة أو محادثات أو بيانات غير متاحة لك.\n\n## 2. تحديد المسار\nبعد فهم السياق، اعرض خيارين فقط:\n\n- **قياس مهاراتي:** أريد معرفة مستوى مهاراتي في اتخاذ القرارات وإدارة المشاريع.\n- **تطوير فكرتي:** أريد اختبار فكرة مشروعي واكتشاف نقاط ضعفها وتحديد الخطوة التالية.\n\nإذا كان المستخدم قد حدد المسار مسبقًا، فلا تطلب منه الاختيار مرة أخرى.\n\n## 3. مسار قياس المهارات\n- استخدم 10 أسئلة أو مواقف متتابعة، سؤالًا واحدًا في كل مرة.\n- لا تعرض خيارات جاهزة ولا تكشف المهارة المستهدفة قبل الإجابة.\n- حلل القرارات والأسباب والافتراضات والمخاطر والتنفيذ.\n- لا تستنتج مستوى المهارة من إجابة واحدة.\n- ميّز بين نقص المعرفة وضعف الحكم وضعف التنفيذ.\n- في النهاية، قدّم تقييمًا أوليًا مبررًا، ونقاط القوة، والفجوات، وأولوية واحدة للتطوير.\n- حوّل الفجوة ذات الأولوية إلى تدريب عملي مرتبط بواقع المستخدم.\n\n## 4. مسار تطوير الفكرة\n- ابدأ من سياق المشروع المتاح، ولا تطلب إعادة وصفه بالكامل.\n- افهم المشكلة المستهدفة، والمستخدم، والقيمة المقترحة، ومرحلة المشروع، والأدلة المتوفرة.\n- اختبر الافتراضات بأسئلة متتابعة، دون تلقين الإجابات.\n- اكشف المخاطر والثغرات والتناقضات، ولا تفترض وجود طلب في السوق دون دليل.\n- لا تنتقل إلى الحلول قبل فهم المشكلة بما يكفي.\n- اقترح تجارب منخفضة التكلفة للتحقق من الفرضيات.\n- اختم بتحديد أهم فجوة والخطوة التالية القابلة للتنفيذ.\n\n## 5. قواعد الإرشاد\n- لا توافق المستخدم تلقائيًا.\n- وضّح الفرق بين الحقيقة والافتراض.\n- لا تخلط بين جودة الفكرة وقدرة صاحبها على تنفيذها.\n- لا تقدم تقييمًا دقيقًا زائفًا أو أحكامًا قاطعة من أدلة محدودة.\n- لا تحوّل كل مشكلة إلى دورة تعليمية؛ علّم المهارة عندما تكون ضرورية لحل المشكلة.\n- اجعل الحوار موجزًا وتفاعليًا، واطرح سؤالًا واحدًا في كل مرة.\n- لا تفرض قرارًا على المستخدم؛ ساعده على فهم المفاضلات واتخاذ القرار بنفسه.\n\n## 6. النتيجة المطلوبة\nيجب أن يخرج المستخدم بفهم أفضل لوضعه، وفجوة محددة تستحق المعالجة، وخطوة عملية يستطيع تنفيذها ضمن مشروعه أو مساره المهني.\n";const LOGO="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAABQCAIAAAB3SddxAAAbNklEQVR42u1deXhV1bXfwxnuPcOdh8wJIQREEVRwxAkERJRBsc8JtI7Is7VWrVatfe3Tqs/WV7WIOKCiKKggo4oog0BA2kqZEQhkIEDInDudae/9/tjJ9RrCIKLUZ/aXj+8md5+91/mdtfZea/3WPsBuWbmgvTHGwE+1QQj5v5ZlPffiC2PGXkUIwRgf/QhC5liCIPxkoWSMEUK+ywhCGkfLslLJJIAQ/NRUEwLAmCCKiqKA72CXAgAAImQaRmmvngMvuMBxHK7qPyl9FEWxqqJiyaeffRe7FBhjAkKGYfQ77bQ/PvH4T9bAly9Z+snHiwRBOGZNEtI67jgOY4xS+lPTSkKIIAimaaY3n+8EJR8FQogQ+gkaOL/37zgOAl3tOLUuKLug7IKyC8qu1gVlF5RdUHZB2dW6oOyCsgvKrtYFZReUXVB2QdnVuqDsgrILyq52qHZUXCWv2ji4diNd0dCF4xGgZIxlUkiHgox3Q+hHr+CwvR1nKDNBJITEWlubmppSqRSjDACAMFJU1e8PaJrKSUreP/NySmnbIvJDsZjHNmmG0G0/xyatcBgcCSGLP/7ko/kLdpXvjMcTzc3NpmFwM0cIuRW3x+vzePQevXoOHzHi4sGD+FdpFf5WtUvHS62OYVK+bBFKDSMFELRM03Gc4wMlN1jbtp9+/Ilnnn4aQiRLkiCKmVJCCFPJZN2BOsuyVi5fMXXKK7/7w+/vvu/XaTQbGuorKyoxxoyy4pLuHo+ng9oed32EENbur63ZswdjzADrXlKi6/rRTMrvq2+/flPeeE0QMKV0wJlncnX5dkIURXN65BWGFP2XEyZyA+FlGp99sjikerpl5fYqLM4LRQNuLaR4oro/xxfM8gUimo//pTg7r3e3kvxwtCSn4Kut2xhjlmU5jjNj+tsF4ejJ3Xv0yCtcvnQpcYhpmo7j8MF543M5jkMcp8MHSgjLaISkv3EyL2zr async function saveBlob(name,b,say){let d=null;try{d=await claude.use("downloads")}catch(e){}
 if(d){try{await d.save({filename:name,data:b});say("")}catch(e){if(!e||e.code!=="declined")say("تعذّر الحفظ. حاول مرة أخرى.")}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();say("إن لم يبدأ التنزيل فاستخدم زر النسخ في تبويب «نسخ المهارة».")}
function saveZip(say){const bin=atob(ZIP),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return saveBlob("founder-mentor.zip",new Blob([u],{type:"application/zip"}),say)}
function Alt(){const[m,setM]=useState("");return h`<details className="alt"><summary>طريقة بديلة: رفعها كمهارة (Skill)</summary><ol>${ALT.map(x=>h`<li key=${x}><span>${x}</span></li>`)}</ol><button className="btn alt" onClick=${()=>saveZip(setM)}><${Icon} n="dl"/> نزّل حزمة Claude (zip)</button>${m&&h`<div className="hint">${m}</div>`}<div className="note"><${Icon} n="info"/><span>المهارات تُحمَّل عندما يتطابق وصفها مع طلبك، ولا توفّر ذاكرة بين المحادثات بمفردها. للسياق الدائم استخدم المشروع، أو اجمع الاثنين.</span></div></details>`}
function LongNote(){const[ok,setOk]=useState(false);return h`<div className="note"><${Icon} n="info"/><span>إن رفضت الواجهة النص لطوله: ارفع المهارة كملف إلى ملفات المشروع (من الخطوة 1: «نزّل الملف»)، واكتب في التعليمات هذا السطر فقط: <b>${LINE}</b> <button className="ch" style=${{minHeight:36,padding:"2px 12px",marginInlineStart:6}} onClick=${async()=>{setOk(await copyText(LINE));setTimeout(()=>setOk(false),2000)}}>${ok?"تم النسخ":"انسخ السطر"}</button></span></div>`}

 claude:{n:"Claude",d:"مشروع في Claude",steps:["افتح Projects ثم New project.","اختر Set project instructions والصق المهارة، ثم احفظ.","أضف ملفًا يصف مشروعك وأهدافك إلى Project knowledge.","افتح محادثة جديدة داخل المشروع واكتب: ابدأ"],note:"كل محادثة داخل مشروع Claude تبدأ مستقلة. المهارة ترى تعليمات المشروع وملفاته، فضع فيها وصف مشروعك."},
 other:{n:"تطبيق آخر",d:"أي تطبيق ذكاء اصطناعي",steps:["افتح إعدادات التطبيق وابحث عن تعليمات النظام (System prompt).","الصق المهارة هناك.","ابدأ محادثة جديدة واكتب: ابدأ"],note:"إن لم يقبل التطبيق نصًا بهذا الطول، ارفع المهارة كملف واجعل التعليمات سطرًا يشير إليه."}};
const DEMO=[["m","قرأت وصف مشروعك. تحب نقيس مهاراتك في القرارات، أم نختبر فكرتك؟"],["u","نختبر فكرتي."],["m","ممتاز. من أول شخص يحتاج مشروعك فعلًا؟ وكيف عرفت ذلك؟"]];
const V={in:d=>({opacity:0,x:-d*30}),mid:{opacity:1,x:0},out:d=>({opacity:0,x:d*30})};
function Stepper({step,go}){const L=["خذ المهارة","فكرتها","الاستخدام"];
 return h`<div className="stp"><${M.i} className="sline" animate=${{width:step*33.3+"%"}} transition=${{type:"spring",stiffness:140,damping:22}}/>${L.map((l,i)=>h`<button key=${i} className=${"sb "+(i<step?"ok":i===step?"on":"")} onClick=${()=>go(i)} aria-label=${l}><span className="sq">${i<step?h`<${Icon} n="check"/>`:i+1}</span><span className="sl">${l}</span></button>`)}</div>`}
function App(){
 const[step,setStep]=useState(0),[dir,setDir]=useState(1),[ok,setOk]=useState(false),[msg,setMsg]=useState(""),[open,setOpen]=useState(false),[tool,setTool]=useState(null),[tk,setTk]=useState({}),[fin,setFin]=useState(false);
 const words=SKILL.trim().split(/\s+/).length;
 const go=i=>{setDir(i>step?1:-1);setStep(Math.max(0,Math.min(2,i)));const e=document.getElementById("go");e&&e.scrollIntoView({behavior:"smooth",block:"start"})};
 const doCopy=async()=>{const r=await copyText(SKILL);setOk(r);if(!r){setOpen(true);setMsg("تعذّر النسخ تلقائيًا. افتح «اعرض النص» وحدّد الكل ثم انسخ.")}else setMsg("")};
 const g=tool?GUIDE[tool]:null,tks=tool?(tk[tool]||[]):[],cnt=tks.filter(Boolean).length,all=g&&cnt===g.steps.length;
 const toggle=i=>setTk(o=>{const a=[...(o[tool]||[])];a[i]=!a[i];return{...o,[tool]:a}});
 const b0=h`<div><h2 className="st">ابدأ بنسخ المهارة</h2><p className="lead">المهارة نص تلصقه في الذكاء الاصطناعي الذي تستخدمه. انسخها الآن، وسنريك أين تلصقها.</p>
  <${M.button} className=${"big"+(ok?" done":"")} whileTap=${{scale:.97}} onClick=${doCopy}><${Icon} n=${ok?"check":"copy"} s=${22}/> ${ok?"تم النسخ":"انسخ المهارة"}<//>
  ${ok&&h`<${M.div} className="note" initial=${{opacity:0,y:8}} animate=${{opacity:1,y:0}}><${Icon} n="check"/><span>رائع. اضغط «التالي» لتعرف ما فكرتها.</span><//>`}

 const b1=h`<div><h2 className="st">مرشد يسألك قبل أن يجيبك</h2><p className="lead">لا يعطيك نصائح عامة. يقرأ ما تتيحه له من معلومات عن مشروعك، ثم يسألك سؤالًا واحدًا في كل مرة، ويقودك إلى خطوة عملية.</p>
  <div className="hint2">ثم تختار أنت ما تريده:</div>
  <div className="grid">${[["target","قياس مهاراتي","أسئلة متتابعة عن قراراتك، ثم تعرف نقاط قوتك وأهم فجوة."],["search","تطوير فكرتي","يختبر فكرتك ويقترح تجارب صغيرة قبل أن تصرف مالًا."]].map(([i,a,b])=>h`<div key=${a} className="card"><span className="ib"><${Icon} n=${i}/></span><b>${a}</b><small>${b}</small></div>`)}</div>
  <div className="demo"><div className="dl">مثال توضيحي لبداية محادثة</div>${DEMO.map(([w,t],i)=>h`<${M.div} key=${i} className=${"bub "+w} initial=${{opacity:0,y:10}} animate=${{opacity:1,y:0}} transition=${{delay:.2+i*.35}}>${t}<//>`)}</div>
  <div className="mini">يعتمد على ما تتيحه بيئتك من ملفات ومحادثات، ولا يدّعي معرفة ما لا يراه.</div></div>`;
 const b2=h`<div><h2 className="st">اختر أين تريد تشغيلها</h2><p className="lead">اضغط على التطبيق الذي تستخدمه، وسنعرض لك الخطوات.</p>
  <div className="tools">${Object.keys(GUIDE).map(k=>h`<${M.button} key=${k} whileTap=${{scale:.97}} className=${"tool"+(tool===k?" on":"")} onClick=${()=>{setTool(k);setFin(false)}}><b>${GUIDE[k].n}</b><small>${GUIDE[k].d}</small><//>`)}</div>
  ${g&&h`<div><div className="cnt"><b>${cnt} من ${g.steps.length}</b><div className="pb"><${M.div} animate=${{width:cnt/g.steps.length*100+"%"}}/></div></div>
  <div>${g.steps.map((x,i)=>h`<button key=${tool+i} role="checkbox" aria-checked=${tks[i]?"true":"false"} className=${"ck"+(tks[i]?" on":"")} onClick=${()=>toggle(i)}><span className="bx">${tks[i]&&h`<${M.span} initial=${{scale:0}} animate=${{scale:1}}><${Icon} n="check"/><//>`}</span><span>${x}</span></button>`)}</div>
  <div className="mini">${g.note}</div>
  ${(all||fin)&&h`<${M.div} className="fin" initial=${{opacity:0,scale:.94}} animate=${{opacity:1,scale:1}}><${Icon} n="check" s=${26}/><div><b>جاهز.</b> اكتب «ابدأ» في المحادثة وجرّب.</div><//>`}
  <details className="more"><summary>تواجه مشكلة؟</summary><${LongNote}/>${tool==="claude"&&h`<${Alt}/>`}<div className="mini">أسماء الأزرار تتغير مع التحديثات. إن لم تجد زرًا بالاسم المذكور فابحث عن أقرب خيار له.</div></details></div>`}</div>`;
 const body=[b0,b1,b2][step];
 return h`<${MotionConfig} reducedMotion="user">
 <header><div className="w"><div className="brand"><svg className="mk" viewBox="0 0 48 40" width="38" height="32" aria-hidden="true"><rect className="a" x="0" y="0" width="4" height="40"/><rect className="a" x="44" y="0" width="4" height="40"/><rect className="b" x="10" y="28" width="7" height="8"/><rect className="b" x="19" y="20" width="7" height="16"/><rect className="c" x="28" y="12" width="7" height="24"/></svg><div><b>Founder Mentor</b><small>مرشد المؤسس</small></div></div><div className="lg"><img src=${LOGO} alt="Startup Syria"/></div></div></header>

 <section id="go" className="wz"><${Stepper} step=${step} go=${go}/>

 <h3 className="soon">قريبًا</h3>
 ${[0,1].map(i=>h`<div key=${i} className="card sk off mys"><span className="ib"><${Icon} n="lock"/></span><div aria-hidden="true"><b className="blur">مهارة جديدة قادمة</b><small className="blur">وصف المهارة يظهر هنا عند إطلاقها.</small></div><span className="chip">قريبًا</span></div>`)}
 <div className="ft">نسخة أولى قيد الاختبار</div></main>

ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
