<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحتي — مشروعك في تسعة مربعات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;500;600;700;800;900&display=swap">
<style>
:root{--g:#005E5E;--gd:#00262A;--acc:#00DC92;--gold:#FF6D6D;--gl:#E1EFEE;--bg:#F4F6F6;--sf:#fff;--tx:#00262A;--ln:#DEDEDE;--mu:rgba(0,38,42,.68);--no:#D63B3B;--mine:#D6F6FD;--r:3px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#00DC92;--gl:#06454A;--bg:#00262A;--sf:#00343A;--tx:#EAF7F5;--ln:rgba(255,255,255,.16);--mu:rgba(234,247,245,.72);--gold:#FF8A8A;--no:#FF8A8A;--mine:#063A47}}
:root[data-theme="dark"]{--g:#00DC92;--gl:#06454A;--bg:#00262A;--sf:#00343A;--tx:#EAF7F5;--ln:rgba(255,255,255,.16);--mu:rgba(234,247,245,.72);--gold:#FF8A8A;--no:#FF8A8A;--mine:#063A47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Alexandria,system-ui,sans-serif;font-weight:400;line-height:1.8;min-height:100vh;transition:background .3s}
body.mine{background:var(--mine)}
.w{max-width:520px;margin-inline:auto}
.en{font-family:Alexandria,sans-serif;direction:ltr;unicode-bidi:isolate}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none;vertical-align:-.15em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);transition:background .3s}
body.mine header,body.mine .nav{background:color-mix(in srgb,var(--mine) 88%,transparent)}
header .w{display:flex;align-items:center;gap:12px;padding:8px 16px}
.logo{cursor:pointer;display:block}
svg.logo [stroke]{stroke:var(--g)}
.bar{flex:1;height:6px;background:var(--ln)}.bar div{height:100%;background:var(--acc)}
.pc{font-size:12px;color:var(--mu);font-weight:500}
main{padding:14px 16px 120px}
.hero{position:relative;background:#00262A;color:#fff;border-radius:var(--r);padding:28px 20px;overflow:hidden;margin-bottom:18px;border:1px solid #005E5E;border-inline-start:6px solid #00DC92}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,220,146,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,146,.1) 1px,transparent 1px);background-size:36px 36px}
.hero>*{position:relative}.hero h1{font-size:28px;font-weight:800;line-height:1.5;margin:8px 0}.hero p{margin:0 0 18px;opacity:.9}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--g);font-size:12px;font-weight:500}
.tag:before,.tag:after{content:"|";color:var(--acc);font-weight:700}.hero .tag{color:#00DC92}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sp{position:relative;overflow:hidden}.sp:before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}.sp:hover:before{opacity:1}
.sp>*{position:relative}
h2{font-size:24px;font-weight:700;margin:0}h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin:0 0 10px;color:var(--g)}
.ttl{display:flex;align-items:center;gap:12px;margin-top:4px}.ib{width:46px;height:46px;border-radius:var(--r);background:var(--g);color:var(--sf);display:grid;place-items:center;font-size:24px;flex:none}
body.mine .ib{background:var(--gold);color:#00262A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px Alexandria,sans-serif;border:0;border-radius:var(--r);padding:12px 18px;min-height:48px;cursor:pointer;background:var(--acc);color:#00262A}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn[disabled]{opacity:.4}
.shiny{background:linear-gradient(110deg,#00262A 35%,#fff 50%,#00262A 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.dots{display:flex;gap:8px;justify-content:center;margin:16px 0 14px}
.ds{position:relative;height:8px;min-width:8px;border:0;border-radius:2px;background:var(--ln);padding:0;cursor:pointer}
.ds:after{content:"";position:absolute;inset:-14px -4px}
.ds.ok{background:var(--g);opacity:.5}.ds.on{background:var(--g);opacity:1}
.ds.me{background:transparent;box-shadow:inset 0 0 0 2px var(--gold);opacity:1}.ds.me.on{background:var(--gold)}
.map{position:relative;max-width:400px;margin:0 auto}.map>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.dot{position:relative;width:54px;height:54px;border-radius:var(--r);background:var(--sf);border:2px solid var(--ln);display:grid;place-items:center;font-size:24px;color:var(--g)}
.node.done .dot{background:var(--g);border-color:var(--g);color:var(--sf)}.node.cur .dot{border-color:var(--acc);background:var(--gl)}
.ring{position:absolute;inset:-2px;border-radius:var(--r);border:2px solid var(--acc)}
.bd{position:absolute;bottom:-5px;inset-inline-start:-5px;background:var(--acc);color:#00262A;width:18px;height:18px;border-radius:2px;display:grid;place-items:center}
.nl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;background:var(--sf);border:1px solid var(--ln);border-radius:2px;padding:1px 10px;white-space:nowrap;line-height:1.8}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:start;font:500 15px Alexandria,sans-serif;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:8px;min-height:52px;cursor:pointer}
.opt b{width:26px;height:26px;border-radius:2px;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:13px;flex:none}
.opt.ok{border-color:var(--acc);background:var(--gl)}.opt.no{border-color:var(--no)}
.fb,.simple{display:flex;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--gl);border-inline-start:3px solid var(--acc);font-size:14px;margin-top:10px}.simple svg{margin-top:5px;color:var(--g)}
ul{padding:0;list-style:none;margin:0}li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}li:last-child{border:0}li svg{color:var(--g);margin-top:6px;font-size:16px}
textarea,input{width:100%;font:400 16px Alexandria,sans-serif;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:12px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.hint{font-size:13px;color:var(--mu);margin:6px 0}.ex{font-size:13px;color:var(--g);font-weight:600;margin:8px 0}
.mine-b{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border:1.5px dashed var(--gold);border-radius:var(--r);padding:12px;margin:14px 0 12px;font-size:14px}
.mine-b svg{color:var(--gold);font-size:22px;margin-top:3px}
body.mine .card{border-color:var(--gold)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .w{display:flex;gap:10px;padding:10px 16px}.nav .nx{flex:1}
img.pv{width:100%;border-radius:var(--r);border:1px solid var(--ln);display:block}
.ft{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:26px;font-size:14px;color:var(--mu)}
.ft a{color:var(--g);font-weight:600;text-decoration:none}.ft svg{fill:var(--acc);color:var(--acc)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--tx);font:800 21px Alexandria,sans-serif}
.lm rect{fill:var(--g)}.lm rect.x{fill:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#005E5E;border:1px solid #005E5E;margin:0 0 18px}.stats div{background:#00262A;padding:8px;text-align:center}.stats b{display:block;font-size:24px;font-weight:800;color:#00DC92;line-height:1.4}.stats span{font-size:12px}
.q{font-weight:700;font-size:18px;margin-bottom:8px}.one{background:#00262A;color:#fff;padding:12px 14px;border-radius:var(--r);border-inline-start:4px solid var(--acc);font-weight:700;font-size:17px}
details summary{cursor:pointer;color:var(--g);font-weight:600;margin-top:12px;min-height:32px}
.cmp{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r);margin-bottom:8px;font-size:14.5px}.cmp svg{margin-top:6px;flex:none}
.cmp.bad{background:color-mix(in srgb,var(--gold) 14%,var(--sf));border-inline-start:4px solid var(--gold)}.cmp.good{background:var(--gl);border-inline-start:4px solid var(--acc)}
.pl{display:flex;align-items:center;gap:8px;flex:none;background:#fff;padding:3px 6px;border-radius:2px;border:1px solid var(--ln)}.pl img{height:26px;width:auto;display:block}
.newb{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px Alexandria,sans-serif;color:var(--g);background:transparent;border:1.5px solid var(--g);border-radius:var(--r);padding:4px 10px;min-height:36px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,38,42,.6);display:grid;place-items:center;padding:20px}.dlg{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-inline-start:4px solid var(--acc);border-radius:var(--r);padding:20px;max-width:380px;width:100%}.dlg p{margin:0 0 14px}
.qr{display:none;align-items:center;gap:18px;margin:26px auto 0;max-width:420px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}.qr div{display:flex;flex-direction:column;flex:1}.qr span{font-size:13px;color:var(--mu)}.qr svg{flex:none;border:1px solid var(--ln)}
@media (pointer:coarse) and (min-width:900px){.qr{display:flex}}
header .w.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 16px}.sp1{flex:1}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;font:600 14px Alexandria,sans-serif;color:var(--mu);background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px;min-height:44px;cursor:pointer}.tab.on{color:var(--g);border-bottom-color:var(--acc)}
.pbar{height:4px;background:var(--ln)}.pbar div{height:100%;background:var(--acc)}
.inb{display:inline-flex;align-items:center;gap:6px;font:600 13px Alexandria,sans-serif;color:#00262A;background:var(--acc);border:0;border-radius:var(--r);padding:4px 10px;min-height:36px;cursor:pointer}
@media (max-width:599px){.newb span,.inb span{display:none}.newb,.inb{padding:4px 9px;min-width:36px;justify-content:center}}
.pl{gap:6px}.pl img+img{border-inline-start:1px solid var(--ln);padding-inline-start:6px}
.cnt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini{display:flex;gap:3px}.mini i{width:14px;height:14px;background:var(--ln);border-radius:2px}.mini i.f{background:var(--acc)}
.pvw{position:relative}.hs{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:3px}
.hs.e{outline:2px dashed var(--acc);outline-offset:-3px;background:color-mix(in srgb,var(--acc) 10%,transparent)}.hs:active{background:color-mix(in srgb,var(--acc) 24%,transparent)}
.rw{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 0;font:inherit;color:var(--tx);cursor:pointer;min-height:56px}.rw:last-of-type{border:0}
.rw .rt{flex:1;min-width:0}.rw small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw>svg:first-child{font-size:20px;color:var(--g)}.rw>svg:last-child{color:var(--mu)}.rw.f>svg:last-child{color:var(--g)}
.sh-ov{position:fixed;inset:0;z-index:30;background:rgba(0,38,42,.55);display:flex;align-items:flex-end}
.sheet{background:var(--sf);color:var(--tx);width:100%;max-width:520px;margin:0 auto;border-top:4px solid var(--acc);border-radius:var(--r) var(--r) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.xb{background:none;border:0;color:var(--tx);font-size:22px;min-width:44px;min-height:44px;cursor:pointer}
.hint.warn{color:var(--no);font-weight:600}
header .w.prow{display:flex;align-items:center;gap:10px;padding:6px 16px}.prow .pb{flex:1;height:6px;background:var(--ln);border-radius:2px;overflow:hidden}.prow .pb div{height:100%;background:var(--acc)}
.pn{font:700 14px Alexandria,sans-serif;min-width:44px;text-align:end;font-variant-numeric:tabular-nums}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:4px;margin:0 0 16px}
.tab2{position:relative;border:0;background:none;font:600 15px Alexandria,sans-serif;color:var(--mu);min-height:48px;cursor:pointer;border-radius:2px}.tab2.on{color:#00262A}
.tind{position:absolute;inset:0;background:var(--acc);border-radius:2px}.tl{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.hero.sm{padding:16px 20px}.hero.sm h1{font-size:22px;margin:4px 0 0}
.mine-b{overflow:hidden}.mine-b>div{flex:1}.mine-b .xb{flex:none;min-width:32px;min-height:32px;font-size:18px;margin:-4px 0 0}.mine-b .xb svg{color:var(--mu);font-size:18px;margin:0}
</style>
</head>

 const W=1800,H=1300,m=40,top=130,cw=(W-2*m)/5,ch=(H-top-m-300)/2,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");

 x.fillStyle="#F4F6F6";x.fillRect(0,0,W,H);x.fillStyle="#00262A";x.fillRect(0,0,W,95);x.fillStyle="#00DC92";x.fillRect(0,95,W,6);

 ${bar}${sheet}</div>`}

function CountUp({to}){const[v,setV]=useState(to),pv=useRef(to);
 useEffect(()=>{const c=Motion.animate(pv.current,to,{duration:.7,ease:"easeOut",onUpdate:x=>setV(Math.round(x))});pv.current=to;return()=>c.stop()},[to]);return h`<span>${v}</span>`}
function Tabs({cur,go}){const it=[["map","خريطة التعلّم","compass",-1],["build","ابنِ نموذجك","target",10]];
 return h`<div className="tabs2" role="tablist">${it.map(([k,l,i_,to])=>{const on=(cur===10)===(k==="build");return h`<button key=${k} role="tab" aria-selected=${on?"true":"false"} className=${"tab2"+(on?" on":"")} onClick=${()=>go(to)}>${on&&h`<${M.span} layoutId="tabind" className="tind" transition=${{type:"spring",stiffness:420,damping:34}}/>`}<span className="tl"><${Icon} n=${i_}/> ${l}</span></button>`})}</div>`}
function App(){
 const[st,setSt]=useState(()=>{try{return{...AR0,...JSON.parse(localStorage.getItem("bmc")||"{}")}}catch(e){return AR0}});
 const up=p=>setSt(s=>({...s,...p})),setAns=(k,v)=>setSt(s=>({...s,ans:{...s.ans,[k]:v}}));
 const[dlg,setDlg]=useState(null),[ip,setIp]=useState(null),[inst,setInst]=useState(false),reset=()=>{up({...AR0});setDlg(null);window.scrollTo(0,0)},install=async()=>{if(ip){ip.prompt();try{await ip.userChoice}catch(e){}setIp(null)}else setDlg("install")};
 useEffect(()=>{const f=e=>{e.preventDefault();setIp(e)},g=()=>setInst(true);window.addEventListener("beforeinstallprompt",f);window.addEventListener("appinstalled",g);try{setInst(matchMedia("(display-mode: standalone)").matches||!!navigator.standalone)}catch(e){}return()=>{window.removeEventListener("beforeinstallprompt",f);window.removeEventListener("appinstalled",g)}},[]);
 useEffect(()=>{try{localStorage.setItem("bmc",JSON.stringify(st))}catch(e){}},[st]);
 const go=(cur,step=0)=>{up({cur,step});window.scrollTo(0,0)};
 const{cur,step}=st,mine=cur===10||(cur>=0&&cur<=9&&step===3);
 useEffect(()=>{document.body.classList.toggle("mine",mine)},[mine]);
 const n=Object.keys(st.done).length,pct=Math.round(n/11*100),s=S[cur];
 let view,nav=null;
 if(cur===-1||cur===10){const bld=cur===10;
  view=h`<div>${!bld&&h`<section className="hero"><span className="tag"><${Icon} n="compass"/> تعلّم سريع</span><${BlurText} tag="h1" text="مشروعك في تسعة مربعات."/>${!bld&&h`<div><p>تعلّم سريع: في كل محطة خلاصة بسطر واحد، ثم خطأ شائع مقابل الأفضل، ثم سؤال، ثم تكتب إجابتك. لا حساب ولا تسجيل.</p><div className="stats"><div><b>11</b><span>محطة</span></div><div><b>20</b><span>دقيقة تقريبًا</span></div><div><b>9</b><span>مربعات</span></div></div><${M.button} className="btn gold" whileTap=${{scale:.97}} onClick=${()=>go(nextIdx(st))}><${Icon} n="play"/> <${Shiny}>${n?"أكمل رحلتك":"ابدأ الرحلة"}<//><//></div>`}</section>`}
  <${Tabs} cur=${cur} go=${go}/>
  <${AP} mode="wait" initial=${false}><${M.div} key=${cur} initial=${{opacity:0,x:bld?-28:28}} animate=${{opacity:1,x:0}} exit=${{opacity:0}} transition=${{duration:.22}}>${bld?h`<${Canvas} st=${st} up=${up} setAns=${setAns} askReset=${()=>setDlg("reset")}/>`:h`<div><h2>خريطة التعلّم</h2><p className="hint" style=${{marginBottom:6}}>اضغط أي محطة. يمكنك الرجوع إلى أي درس في أي وقت.</p><${MapV} st=${st} go=${go}/></div>`}<//><//></div>`;nav=null}
 else{
  const body=[
   h`<${Card}><h3><${Icon} n="bulb"/> الفكرة</h3><div className="q">${s.q}</div><div className="one">${s.one}</div>${s.w&&h`<div className="simple"><${Icon} n="info"/><span><b>بكلمات بسيطة:</b> ${s.w}</span></div>`}<details><summary>تفاصيل أكثر</summary><p style=${{margin:"8px 0 0"}}>${s.d}</p></details><//>`,
   h`<${Card}><h3><${Icon} n="eye"/> ${cur?"مثال من «دَرْسي»":"قبل أن نبدأ"}</h3>${cur>0&&h`<div className="hint" style=${{marginTop:0}}>«دَرْسي» تطبيق يساعد الطالب الجامعي على إيجاد مدرس خصوصي وحجز حصة معه.</div>`}${cur>0&&h`<${M.div} className="cmp bad" initial=${{opacity:0,x:16}} animate=${{opacity:1,x:0}}><${Icon} n="x"/><span><b>خطأ شائع:</b> ${s.no}</span><//><${M.div} className="cmp good" initial=${{opacity:0,x:16}} animate=${{opacity:1,x:0}} transition=${{delay:.15}}><${Icon} n="check"/><span><b>الأفضل:</b> ${s.ex[0]}</span><//><div className="hint">أمثلة أخرى</div>`}<ul>${(cur?s.ex.slice(1):s.ex).map((t,j)=>h`<${M.li} key=${j} initial=${{opacity:0,x:16}} animate=${{opacity:1,x:0}} transition=${{delay:.1+j*.12}}><${Icon} n="check"/><span>${t}</span><//>`)}</ul><//>`,
   h`<${Quiz} key=${cur} i=${cur} s=${s} st=${st} up=${up}/>`,
   h`<div><div className="mine-b" style=${{marginTop:0}}><${Icon} n="pen"/><div><b>الآن دورك</b><br/>هذا الجزء عن مشروعك أنت، لا عن «دَرْسي». لذلك تغيّر لون الخلفية.</div></div>
   ${s.a?h`<${Card}><h3><${Icon} n="pen"/> طبّق على مشروعك</h3><b>${s.a}</b><div className="ex">مثال: ${s.x}</div><textarea rows="5" placeholder="اكتب نقاطًا قصيرة…" value=${st.ans[s.k]||""} onChange=${e=>setAns(s.k,e.target.value)}/><div className="hint">يُحفظ ما تكتبه تلقائيًا ويظهر في لوحتك النهائية.</div><//>`
   :h`<${Card}><h3><${Icon} n="pen"/> اختر مشروعك</h3><b>ما اسم المشروع الذي ستعمل عليه؟</b><div className="hint">اكتب اسم مشروعك، أو اتركه فارغًا واستخدم المثال «دَرْسي» أثناء الرحلة.</div><input placeholder="اسم مشروعك" value=${st.title} onChange=${e=>up({title:e.target.value})}/><//>`}</div>`][step];
  view=h`<div><div className="ttl"><span className="ib"><${Icon} n=${s.e}/></span><${BlurText} key=${cur} text=${s.t}/></div><${Dots} step=${step} go=${j=>go(cur,j)}/>${body}</div>`;
  const last=step===3;
  nav=[cur>0||step>0,last?(cur===9?"إلى لوحة نموذجك":"المحطة التالية"):"التالي","back",()=>step>0?go(cur,step-1):go(cur-1,3),()=>{if(last){up({done:{...st.done,[cur]:1}});go(cur+1)}else go(cur,step+1)}];
 }
 const modal=h`<${AP}>${dlg&&h`<${M.div} key="m" className="ov" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} onClick=${()=>setDlg(null)}><${M.div} className="dlg" role="dialog" aria-modal="true" initial=${{y:20,opacity:0}} animate=${{y:0,opacity:1}} onClick=${e=>e.stopPropagation()}>${dlg==="reset"?h`<h3><${Icon} n="reset"/> بداية جديدة؟</h3><p>سيُمسح كل ما كُتب وكل التقدّم، ليبدأ شخص جديد من الصفر.</p><div className="row"><button className="btn alt" onClick=${()=>setDlg(null)}>إلغاء</button><button className="btn" onClick=${reset}>نعم، ابدأ من جديد</button></div>`:h`<h3><${Icon} n="dl"/> ثبّت التطبيق على جوالك</h3><p><b>أندرويد:</b> من قائمة المتصفح (النقاط الثلاث) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p><p><b>آيفون:</b> افتح الرابط في Safari، اضغط زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية».</p><button className="btn" style=${{width:"100%"}} onClick=${()=>setDlg(null)}>تمام</button>`}<//><//>`}<//>`;
 return h`<${MotionConfig} reducedMotion="user">
 <header><div className="w"><${Logo} onClick=${()=>go(-1)}/><div className="sp1"/>${!inst&&h`<button className="inb" onClick=${install} aria-label="تثبيت التطبيق على الجوال"><${Icon} n="dl"/><span>تثبيت</span></button>`}<button className="newb" onClick=${()=>setDlg("reset")} aria-label="بداية جديدة لشخص جديد"><${Icon} n="reset"/><span>جديد</span></button><div className="pl"><img src=${GEW} alt="Global Entrepreneurship Week Syria" width="70" height="26"/><img src=${SS} alt="Startup Syria" width="36" height="26"/></div></div>
 <div className="w prow"><div className="pb" role="progressbar" aria-label="التقدّم" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${pct}><${M.div} animate=${{width:pct+"%"}} initial=${false} transition=${{type:"spring",stiffness:120,damping:20}}/></div><b className="pn" dir="ltr"><${CountUp} to=${pct}/>%</b><span className="pc">${n}/11</span></div></header>
 <div className="w"><main><${AP} mode="wait" initial=${false}><${M.div} key=${(cur===-1||cur===10)?"home":cur+"-"+step} initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-8}} transition=${{duration:.25}}>${view}<//><//><${Footer} credit=${cur===10}/></main></div>
 ${nav&&h`<div className="nav"><div className="w"><button className="btn alt" disabled=${!nav[0]} onClick=${nav[3]}><${Icon} n="fwd"/> السابق</button><${M.button} className="btn nx" whileTap=${{scale:.98}} onClick=${nav[4]}>${nav[1]} <${Icon} n=${nav[2]}/><//></div></div>`}${modal}<//>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
</body>
</html>
