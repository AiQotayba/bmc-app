<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة نموذج العمل التجاري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;500;600;700;800;900&display=swap">
<style>
:root{--g:#005E5E;--gd:#00262A;--acc:#00DC92;--gold:#FF6D6D;--gl:#E1EFEE;--bg:#F4F6F6;--sf:#fff;--tx:#00262A;--ln:#DEDEDE;--mu:rgba(0,38,42,.68);--no:#D63B3B;--mine:#D6F6FD;--r:3px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#00DC92;--gl:#06454A;--bg:#00262A;--sf:#00343A;--tx:#EAF7F5;--ln:rgba(255,255,255,.16);--mu:rgba(234,247,245,.72);--gold:#FF8A8A;--no:#FF8A8A;--mine:#063A47}}
:root[data-theme="dark"]{--g:#00DC92;--gl:#06454A;--bg:#00262A;--sf:#00343A;--tx:#EAF7F5;--ln:rgba(255,255,255,.16);--mu:rgba(234,247,245,.72);--gold:#FF8A8A;--no:#FF8A8A;--mine:#063A47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Alexandria,system-ui,sans-serif;font-weight:400;line-height:1.8;min-height:100vh;transition:background .3s}
body.mine{background:var(--mine)}
.w{max-width:520px;margin-inline:auto}
.en{font-family:Alexandria,sans-serif;direction:ltr;unicode-bidi:isolate}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none;vertical-align:-.15em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);transition:background .3s}
body.mine header,body.mine .nav{background:color-mix(in srgb,var(--mine) 88%,transparent)}
header .w{display:flex;align-items:center;gap:12px;padding:8px 16px}
.logo{cursor:pointer;display:block}
svg.logo [stroke]{stroke:var(--g)}
.bar{flex:1;height:6px;background:var(--ln)}.bar div{height:100%;background:var(--acc)}
.pc{font-size:12px;color:var(--mu);font-weight:500}
main{padding:14px 16px 120px}
.hero{position:relative;background:#00262A;color:#fff;border-radius:var(--r);padding:28px 20px;overflow:hidden;margin-bottom:18px;border:1px solid #005E5E;border-inline-start:6px solid #00DC92}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,220,146,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,146,.1) 1px,transparent 1px);background-size:36px 36px}
.hero>*{position:relative}.hero h1{font-size:28px;font-weight:800;line-height:1.5;margin:8px 0}.hero p{margin:0 0 18px;opacity:.9}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--g);font-size:12px;font-weight:500}
.tag:before,.tag:after{content:"|";color:var(--acc);font-weight:700}.hero .tag{color:#00DC92}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sp{position:relative;overflow:hidden}.sp:before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}.sp:hover:before{opacity:1}
.sp>*{position:relative}
h2{font-size:24px;font-weight:700;margin:0}h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin:0 0 10px;color:var(--g)}
.ttl{display:flex;align-items:center;gap:12px;margin-top:4px}.ib{width:46px;height:46px;border-radius:var(--r);background:var(--g);color:var(--sf);display:grid;place-items:center;font-size:24px;flex:none}
body.mine .ib{background:var(--gold);color:#00262A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px Alexandria,sans-serif;border:0;border-radius:var(--r);padding:12px 18px;min-height:48px;cursor:pointer;background:var(--acc);color:#00262A}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn[disabled]{opacity:.4}
.shiny{background:linear-gradient(110deg,#00262A 35%,#fff 50%,#00262A 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.dots{display:flex;gap:8px;justify-content:center;margin:16px 0 14px}
.ds{position:relative;height:8px;min-width:8px;border:0;border-radius:2px;background:var(--ln);padding:0;cursor:pointer}
.ds:after{content:"";position:absolute;inset:-14px -4px}
.ds.ok{background:var(--g);opacity:.5}.ds.on{background:var(--g);opacity:1}
.ds.me{background:transparent;box-shadow:inset 0 0 0 2px var(--gold);opacity:1}.ds.me.on{background:var(--gold)}
.map{position:relative;max-width:400px;margin:0 auto}.map>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.dot{position:relative;width:54px;height:54px;border-radius:var(--r);background:var(--sf);border:2px solid var(--ln);display:grid;place-items:center;font-size:24px;color:var(--g)}
.node.done .dot{background:var(--g);border-color:var(--g);color:var(--sf)}.node.cur .dot{border-color:var(--acc);background:var(--gl)}
.ring{position:absolute;inset:-2px;border-radius:var(--r);border:2px solid var(--acc)}
.bd{position:absolute;bottom:-5px;inset-inline-start:-5px;background:var(--acc);color:#00262A;width:18px;height:18px;border-radius:2px;display:grid;place-items:center}
.nl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;background:var(--sf);border:1px solid var(--ln);border-radius:2px;padding:1px 10px;white-space:nowrap;line-height:1.8}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:start;font:500 15px Alexandria,sans-serif;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:8px;min-height:52px;cursor:pointer}
.opt b{width:26px;height:26px;border-radius:2px;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:13px;flex:none}
.opt.ok{border-color:var(--acc);background:var(--gl)}.opt.no{border-color:var(--no)}
.fb,.simple{display:flex;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--gl);border-inline-start:3px solid var(--acc);font-size:14px;margin-top:10px}.simple svg{margin-top:5px;color:var(--g)}
ul{padding:0;list-style:none;margin:0}li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}li:last-child{border:0}li svg{color:var(--g);margin-top:6px;font-size:16px}
textarea,input{width:100%;font:400 16px Alexandria,sans-serif;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:12px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.hint{font-size:13px;color:var(--mu);margin:6px 0}.ex{font-size:13px;color:var(--g);font-weight:600;margin:8px 0}
.mine-b{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border:1.5px dashed var(--gold);border-radius:var(--r);padding:12px;margin:14px 0 12px;font-size:14px}
.mine-b svg{color:var(--gold);font-size:22px;margin-top:3px}
body.mine .card{border-color:var(--gold)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .w{display:flex;gap:10px;padding:10px 16px}.nav .nx{flex:1}
img.pv{width:100%;border-radius:var(--r);border:1px solid var(--ln);display:block}
.ft{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:26px;font-size:14px;color:var(--mu)}
.ft a{color:var(--g);font-weight:600;text-decoration:none}.ft svg{fill:var(--acc);color:var(--acc)}
</style>
</head>

const S=[
{k:"intro",e:"compass",t:"ما هو نموذج العمل؟",en:"Business Model Canvas",q:"كيف تتحول فكرتك إلى مشروع؟",d:"أي مشروع، من محل صغير إلى تطبيق، يحتاج إجابات عن أسئلة بسيطة: لمن أبيع؟ ماذا أقدّم لهم؟ كيف يعرفون بي؟ كيف أكسب المال؟ وكم سأصرف؟ نموذج العمل التجاري لوحة من تسعة مربعات تضع فيها هذه الإجابات في مكان واحد.",w:"هو ملخص من صفحة واحدة يشرح كيف يعمل مشروعك ويكسب. لا يضمن نجاح الفكرة، لكنه يوضحها ويكشف ما تحتاج إلى تجربته.",ex:["مثالنا طوال الرحلة: «دَرْسي»، تطبيق يساعد الطالب الجامعي على إيجاد مدرس خصوصي مناسب وحجز حصة معه.","في كل محطة سنملأ مربعًا واحدًا من اللوحة لهذا المثال.","ثم تملأ أنت المربع نفسه لمشروعك."],qz:["ما فائدة نموذج العمل التجاري؟",["تصميم شعار المشروع وألوانه.","فهم كيف يعمل المشروع ويكسب في صفحة واحدة.","ضمان أن المشروع سينجح."],1,"النموذج يوضح الصورة كاملة، لكنه لا يضمن النجاح."]},
{k:"cs",e:"users",t:"شرائح العملاء",en:"Customer Segments",q:"لمن صُمّم مشروعك؟",d:"العميل هو الشخص الذي تخدمه أو يشتري منك. «الشريحة» مجموعة من الناس تجمعهم حاجة واحدة. كلما حدّدتهم بدقة، عرفت ماذا يحتاجون وكيف تصل إليهم.",w:"بدل أن تقول «كل الناس»، حدّد أول شخص يحتاج مشروعك فعلًا.",ex:["طلاب المعلوماتية في جامعة إدلب الذين يجدون صعوبة في البرمجة.","طلاب يستعدون للامتحانات ويريدون حصص مراجعة.","مدرسون خصوصيون يريدون الوصول إلى طلاب جدد."],qz:["أي جملة تصف العملاء بوضوح أكثر؟",["كل من يستخدم الإنترنت.","طلاب المعلوماتية في جامعة إدلب الذين يحتاجون مساعدة في البرمجة.","حصص تدريس عبر الإنترنت."],1,"الخيار الثاني يحدد من هم وماذا يحتاجون. الثالث يصف الخدمة لا العملاء."],a:"من هم الأشخاص الذين سيستخدمون مشروعك، وما أهم حاجة لديهم؟",x:"طلاب المعلوماتية في جامعة إدلب، يحتاجون مساعدة في مواد البرمجة."},
{k:"vp",e:"gem",t:"القيمة المقترحة",en:"Value Propositions",q:"لماذا سيختارك العميل؟",d:"القيمة هي الفائدة التي يحصل عليها العميل منك، أو المشكلة التي تحلها له. ليست مجرد ميزة في المنتج، بل سبب يجعله يفضّلك.",w:"اسأل نفسك: ماذا سيتغير في حياة العميل بعد أن يستخدم مشروعي؟",ex:["يجد مدرسًا مناسبًا للمادة والمستوى والميزانية.","يقارن بين المدرسين قبل أن يحجز.","يحجز حصة بسهولة بدل البحث العشوائي."],qz:["أي جملة تعبّر عن قيمة للعميل؟",["واجهة بألوان جذابة.","يساعد الطالب على إيجاد مدرس مناسب ومقارنة الخيارات قبل الحجز.","التطبيق مبني بتقنية حديثة."],1,"القيمة هي ما يستفيده الطالب، لا طريقة بناء التطبيق أو شكله."],a:"ما الفائدة التي سيحصل عليها العميل من مشروعك؟",x:"مساعدة الطلاب على إيجاد مدرس مناسب وحجز حصة بسهولة."},

async function draw(st){
 try{await Promise.all([document.fonts.load("700 28px Alexandria"),document.fonts.load("400 24px Alexandria")])}catch(e){}
 const W=1800,H=1300,m=40,top=130,cw=(W-2*m)/5,ch=(H-top-m-300)/2,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 x.direction="rtl";x.textAlign="right";x.textBaseline="top";
 x.fillStyle="#F4F6F6";x.fillRect(0,0,W,H);x.fillStyle="#00262A";x.fillRect(0,0,W,95);x.fillStyle="#00DC92";x.fillRect(0,95,W,6);
 x.fillStyle="#fff";x.font="800 40px Alexandria";x.fillText(st.title||"نموذج العمل التجاري",W-m,24);
 x.fillStyle="#00DC92";x.fillRect(m,36,24,24);
 const box=(X,Y,w,hh,s)=>{x.fillStyle="#fff";x.strokeStyle="#DEDEDE";x.lineWidth=2;x.beginPath();x.roundRect(X,Y,w,hh,4);x.fill();x.stroke();
  x.fillStyle="#005E5E";x.direction="rtl";x.textAlign="right";x.font="700 26px Alexandria";x.fillText(s.t,X+w-18,Y+14,w-36);
  x.fillStyle="#5F8587";x.direction="ltr";x.font="500 16px Alexandria";x.fillText(s.en,X+w-18,Y+50);x.direction="rtl";
  x.fillStyle="#00262A";x.font="400 22px Alexandria";const lh=34;let y=Y+84;
  for(const para of ((st.ans||{})[s.k]||"").trim().split("\n")){let line="";for(const wd of para.split(/\s+/)){const tr=line?line+" "+wd:wd;if(x.measureText(tr).width>w-36&&line){if(y+lh>Y+hh-8)return;x.fillText(line,X+w-18,y);y+=lh;line=wd}else line=tr}
   if(line){if(y+lh>Y+hh-8)return;x.fillText(line,X+w-18,y);y+=lh}}};
 const by=k=>T.find(s=>s.k===k);
 for(const k in POS){const[col,row,rs]=POS[k];box(m+col*cw+4,top+row*ch+4,cw-8,rs*ch-8,by(k))}
 const bw=(W-2*m)/2,y0=top+2*ch+4;
 box(m+4,y0,bw-8,296,by("cost"));box(m+bw+4,y0,bw-8,296,by("rs"));

 return new Promise(r=>c.toBlob(r,"image/png"));
}

  const body=[
   h`<${Card}><h3><${Icon} n="bulb"/> الفكرة</h3><b>${s.q}</b><p style=${{margin:"8px 0 0"}}>${s.d}</p>${s.w&&h`<div className="simple"><${Icon} n="info"/><span><b>بكلمات بسيطة:</b> ${s.w}</span></div>`}<//>`,
   h`<${Card}><h3><${Icon} n="eye"/> ${cur?"مثال من «دَرْسي»":"قبل أن نبدأ"}</h3>${cur>0&&h`<div className="hint" style=${{marginTop:0}}>«دَرْسي» تطبيق يساعد الطالب الجامعي على إيجاد مدرس خصوصي وحجز حصة معه.</div>`}<ul>${s.ex.map((t,j)=>h`<${M.li} key=${j} initial=${{opacity:0,x:16}} animate=${{opacity:1,x:0}} transition=${{delay:.1+j*.12}}><${Icon} n="check"/><span>${t}</span><//>`)}</ul><//>`,
   h`<${Quiz} key=${cur} i=${cur} s=${s} st=${st} up=${up}/>`,
   h`<div><div className="mine-b" style=${{marginTop:0}}><${Icon} n="pen"/><div><b>الآن دورك</b><br/>هذا الجزء عن مشروعك أنت، لا عن «دَرْسي». لذلك تغيّر لون الخلفية.</div></div>
   ${s.a?h`<${Card}><h3><${Icon} n="pen"/> طبّق على مشروعك</h3><b>${s.a}</b><div className="ex">مثال: ${s.x}</div><textarea rows="5" placeholder="اكتب نقاطًا قصيرة…" value=${st.ans[s.k]||""} onChange=${e=>setAns(s.k,e.target.value)}/><div className="hint">يُحفظ ما تكتبه تلقائيًا ويظهر في لوحتك النهائية.</div><//>`
   :h`<${Card}><h3><${Icon} n="pen"/> اختر مشروعك</h3><b>ما اسم المشروع الذي ستعمل عليه؟</b><div className="hint">اكتب اسم مشروعك، أو اتركه فارغًا واستخدم المثال «دَرْسي» أثناء الرحلة.</div><input placeholder="اسم مشروعك" value=${st.title} onChange=${e=>up({title:e.target.value})}/><//>`}</div>`][step];
  view=h`<div><div className="ttl"><span className="ib"><${Icon} n=${s.e}/></span><${BlurText} key=${cur} text=${s.t}/></div><${Dots} step=${step} go=${j=>go(cur,j)}/>${body}</div>`;
  const last=step===3;
  nav=[cur>0||step>0,last?(cur===9?"إلى لوحة نموذجك":"المحطة التالية"):"التالي","back",()=>step>0?go(cur,step-1):go(cur-1,3),()=>{if(last){up({done:{...st.done,[cur]:1}});go(cur+1)}else go(cur,step+1)}];
 }
 return h`<${MotionConfig} reducedMotion="user">
 <header><div className="w"><${Logo} onClick=${()=>go(-1)}/><div className="bar"><${M.div} animate=${{width:n/11*100+"%"}} initial=${false}/></div><span className="pc">${n}/11</span></div></header>
 <div className="w"><main><${AP} mode="wait" initial=${false}><${M.div} key=${cur+"-"+step} initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-8}} transition=${{duration:.25}}>${view}<//><//><${Footer}/></main></div>
 ${nav&&h`<div className="nav"><div className="w"><button className="btn alt" disabled=${!nav[0]} onClick=${nav[3]}><${Icon} n="fwd"/> السابق</button><${M.button} className="btn nx" whileTap=${{scale:.98}} onClick=${nav[4]}>${nav[1]} <${Icon} n=${nav[2]}/><//></div></div>`}<//>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
</body>
</html>
